run_id: qwen_gr00t_robotwin
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_RoboTwin
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    # Switch only this field for controlled comparisons:
    # v_prediction | x_prediction | x_prediction_v_loss
    prediction_type: v_prediction
    t_eps: 0.05
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    # Generated by prepare_robotwin_dataset.py; views contain only symlinks + metadata.
    data_root_dir: playground/Datasets/RoboTwin
    # 50 tasks x 50 clean trajectories = 2,500 demonstrations.  The
    # randomized view is held out for the robustness evaluation.
    data_mix: robotwin_clean_50
    action_type: abs_qpos
    action_mode: abs
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  # 8 GPUs x per-device batch 8 x 75k updates = 4.8M sampled windows,
  # matching the previous 8 x 4 x 150k setup while reducing wall-clock time.
  max_train_steps: 37500
  num_warmup_steps: 2000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
