run_id: starvla
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: jinhuiye
wandb_project: starVLA_Libero
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    # v_prediction: released GR00T baseline (v output, v-MSE)
    # x_prediction: clean-action output with direct, unweighted x-MSE
    # x_prediction_v_loss: ABot AML (clean-action output, velocity-MSE)
    prediction_type: x_prediction_v_loss
    t_eps: 0.05  # ABot AML denominator clamp for x_prediction_v_loss

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 16

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/pfs/pg4hw0/mobile/qiwei/mobile/starVLA_xpred_v-pred/starVLA/playground/Datasets/libero
    data_mix: libero_all # libero_goal
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  # 9 epochs: 273,465 samples, distributed over 5 ranks (54,693 microbatches
  # per rank) and accumulated 4 at a time => ceil(54,693 / 4) * 9 = 123,066.
  max_train_steps: 120000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: '' #'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 0.5
  gradient_accumulation_steps: 4
  fail_on_nonfinite_loss: true
  fail_on_nonfinite_params: true
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
